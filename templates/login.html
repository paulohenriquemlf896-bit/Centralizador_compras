<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Central de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { max-width: 400px; width: 100%; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); background: white; }
        .logo-img { display: block; margin: 0 auto 20px; max-width: 120px; }
        .btn-custom { background-color: #0d6efd; color: white; width: 100%; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="{{ url_for('static', filename='img/Logo.png') }}" alt="Logo Central" class="logo-img">
        
        <h4 class="text-center mb-4">Acesso ao Sistema</h4>
        
        {% if erro %}
            <div class="alert alert-danger text-center">{{ erro }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" required placeholder="ex: miguel@loja.com">
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" required>
            </div>
            <button type="submit" class="btn btn-custom py-2">Entrar</button>
        </form>
    </div>

</body>
</html>
