<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Loja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="{{ url_for('static', filename='img/Logo.png') }}" height="40" class="me-2">
                Central de Compras
            </a>
            <span class="navbar-text">Olá, {{ nome }} | <a href="/logout" class="text-danger text-decoration-none">Sair</a></span>
        </div>
    </nav>

    <div class="container">
        <h3>Períodos de Compra</h3>
        <p class="text-muted">Selecione o período aberto para iniciar seu pedido.</p>
        
        <div class="row mt-4">
            <div class="col-md-6 mb-3">
                <div class="card border-success h-100">
                    <div class="card-body">
                        <h5 class="card-title text-success">🟢 Medicamentos 2.1</h5>
                        <p class="card-text">Período Aberto. Encerra dia 17/11.</p>
                        
                        <a href="{{ url_for('pedido_medicamentos') }}" class="btn btn-success w-100">
                            Fazer Pedido
                        </a>
                        
                    </div>
                </div>
            </div>
            
            <div class="col-md-6 mb-3">
                <div class="card bg-light text-muted h-100">
                    <div class="card-body">
                        <h5 class="card-title">🔴 Diversos</h5>
                        <p class="card-text">Fechado. Próxima abertura em 01/12.</p>
                        <button class="btn btn-secondary w-100" disabled>Indisponível</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
