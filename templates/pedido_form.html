<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Pedido - {{ nome_periodo }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table-input { width: 80px; text-align: center; }
        .lab-badge { font-size: 0.8rem; background-color: #e9ecef; color: #495057; padding: 2px 6px; border-radius: 4px; }
        .total-bar { background-color: #f8f9fa; border: 2px solid #e9ecef; border-radius: 8px; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('selecao_fabricante', periodo_id=periodo_id) }}">
                <span class="me-2">⬅️</span> Voltar
            </a>
            <span class="navbar-text fw-bold text-primary">{{ laboratorio_atual }} - {{ nome_periodo }}</span>
        </div>
    </nav>

    <div class="container mb-5">
        <form method="POST" action="{{ url_for('pedido_form', periodo_id=periodo_id, laboratorio=laboratorio_atual) }}">
            
            <div class="bg-white p-4 border rounded shadow-sm">
                
                <div class="table-responsive mb-3">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th scope="col" style="width: 50%">Produto</th>
                                <th scope="col" style="width: 15%">Preço Unit.</th>
                                <th scope="col" style="width: 15%">Caixa Emb.</th>
                                <th scope="col" style="width: 20%">Qtd.</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for produto in produtos %}
                            <tr>
                                <td>
                                    <strong>{{ produto.nome }}</strong>
                                </td>
                                <td class="fw-bold text-secondary">R$ {{ "%.2f" % produto.preco }}</td>
                                <td class="text-muted small">Cx com {{ produto.unidade_caixa }}</td>
                                <td>
                                    <input type="number" 
                                           class="form-control table-input mx-auto item-pedido" 
                                           name="qtd_{{ produto.id }}"
                                           value="{{ itens_salvos.get(produto.id, '') }}"
                                           placeholder="0" min="0"
                                           data-caixa="{{ produto.unidade_caixa }}"
                                           data-preco="{{ produto.preco }}"
                                           onchange="validarCaixa(this)"
                                           oninput="calcularTotais()">
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-between align-items-center p-3 total-bar mb-4">
                    <div><span class="text-muted">Total Itens:</span> <strong id="display-qtd-total">0</strong></div>
                    <div><span class="text-muted">Total R$:</span> <strong class="text-success" id="display-valor-total">0,00</strong></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" name="acao" value="rascunho" class="btn btn-warning text-dark w-50">
                        💾 Salvar Rascunho (Voltar)
                    </button>
                    <button type="submit" name="acao" value="finalizar" class="btn btn-success w-50">
                        ✅ Salvar e Concluir
                    </button>
                </div>
            </div>
        </form> 
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        function validarCaixa(input) {
            let tamanhoCaixa = parseInt(input.getAttribute('data-caixa'));
            let valor = parseInt(input.value);

            if (!isNaN(valor) && valor > 0 && valor % tamanhoCaixa !== 0) {
                alert("Atenção! A caixa de embarque é de " + tamanhoCaixa + " unidades. Por favor, ajuste o valor para um múltiplo.");
                input.classList.add('is-invalid');
            } else {
                input.classList.remove('is-invalid');
            }
            calcularTotais(); 
        }

        function calcularTotais() {
            let inputs = document.querySelectorAll('.item-pedido');
            let totalQtd = 0;
            let totalValor = 0.0;

            inputs.forEach(input => {
                let qtd = parseInt(input.value);
                let preco = parseFloat(input.getAttribute('data-preco'));

                if (!isNaN(qtd) && qtd > 0) {
                    totalQtd += qtd;
                    totalValor += (qtd * preco);
                }
            });

            document.getElementById('display-qtd-total').innerText = totalQtd;
            document.getElementById('display-valor-total').innerText = totalValor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // Calcula ao carregar (para exibir valores salvos)
        document.addEventListener("DOMContentLoaded", function() {
            calcularTotais();
        });
    </script>
</body>
</html>
