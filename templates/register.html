<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Central de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card-custom { max-width: 500px; width: 100%; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); background: white; }
        .logo-img { display: block; margin: 0 auto 20px; max-width: 100px; }
    </style>
</head>
<body>

    <div class="card-custom">
        <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="Logo" class="logo-img">
        
        <h4 class="text-center mb-4">Criar Nova Conta</h4>
        
        {% if erro %}
            <div class="alert alert-danger">{{ erro }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('register') }}">
            
            <div class="mb-3">
                <label class="form-label">Nome Completo</label>
                <input type="text" class="form-control" name="nome" required placeholder="Ex: João Silva">
            </div>

            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-control" name="email" required placeholder="Ex: joao@loja.com">
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Senha</label>
                    <input type="password" class="form-control" name="senha" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Função</label>
                    <select class="form-select" name="funcao" id="selectFuncao" onchange="toggleLoja()" required>
                        <option value="Loja" selected>Gerente de Loja</option>
                        <option value="Admin">Comprador (Admin)</option>
                    </select>
                </div>
            </div>

            <div class="mb-4" id="divLoja">
                <label class="form-label">Selecione a Unidade</label>
                <select class="form-select" name="loja_id">
                    <option value="" selected disabled>Escolha...</option>
                    {% for loja in lojas %}
                        <option value="{{ loja.id }}">{{ loja.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-success">Cadastrar</button>
                <a href="{{ url_for('login') }}" class="btn btn-outline-secondary">Voltar para Login</a>
            </div>
        </form>
    </div>

    <script>
        function toggleLoja() {
            var funcao = document.getElementById("selectFuncao").value;
            var divLoja = document.getElementById("divLoja");
            
            if (funcao === "Admin") {
                divLoja.style.display = "none";
            } else {
                divLoja.style.display = "block";
            }
        }
    </script>
</body>
</html>
